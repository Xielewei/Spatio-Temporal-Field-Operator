<text x="46" y="148" fill="#FFFFFF" font-size="88" font-weight="700" letter-spacing="2">STFO<tspan fill="#E9AE87">.</tspan></text>
<text x="50" y="189" fill="#D8E9EF" font-size="24">Spatio-Temporal Field Operator</text>
<text x="50" y="223" fill="#94B6C4" font-size="15">Expanding sensors. A shared field. Adaptive dynamics.</text>
</g>

