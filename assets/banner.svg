<title id="title">STFO — Spatio-Temporal Field Operator</title>
<desc id="desc">A blue and copper project banner with a stylized spatial field.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112B3C"/><stop offset="1" stop-color="#173E50"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#78C8D2" stop-opacity=".18"/><stop offset="1" stop-color="#78C8D2" stop-opacity="0"/></radialGradient>
</defs>
